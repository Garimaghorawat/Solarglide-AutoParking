<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarGlide — Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">☀️ SolarGlide</div>
        <div class="user-info">
            <div class="user-avatar" style="background:rgba(168,85,247,0.15); border-color:#a855f7; color:#a855f7;">A
            </div>
            <div class="user-meta">
                <span class="name">Admin</span>
                <span class="role">Administrator</span>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            <button class="btn btn-outline btn-sm" onclick="logout()">↩ Logout</button>
        </div>
    </header>

    <div class="dashboard-container">

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card blue">
                <div class="stat-label">📊 Total Slots</div>
                <div class="stat-value" id="statTotal">8</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">✅ Available</div>
                <div class="stat-value" id="statAvailable">—</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-label">🚗 Occupied</div>
                <div class="stat-value" id="statOccupied">—</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">📋 Total Sessions</div>
                <div class="stat-value" id="statSessions">—</div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('overview')">📋 Overview</button>
            <button class="tab-btn" onclick="switchTab('slots')">🅿️ All Slots</button>
            <button class="tab-btn" onclick="switchTab('gate')">🚧 Gate Events</button>
            <button class="tab-btn" onclick="switchTab('history')">📜 History</button>
        </div>

        <!-- Tab: Overview -->
        <div class="tab-content active" id="tab-overview">
            <div class="section-header">
                <div class="section-title">🅿️ Slot Status</div>
            </div>
            <div class="admin-slots-grid" id="adminSlotGrid">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Tab: All Slots (detailed) -->
        <div class="tab-content" id="tab-slots">
            <div class="panel">
                <div class="panel-title">🅿️ All Parking Slots</div>
                <div class="admin-slots-grid" id="allSlotsGrid">
                    <!-- Filled by JS -->
                </div>
            </div>
        </div>

        <!-- Tab: Gate Events -->
        <div class="tab-content" id="tab-gate">
            <div class="panel">
                <div class="panel-title">🚧 Gate Events</div>
                <div id="gateEventsContainer">
                    <div class="empty-state">
                        <div class="icon">🚧</div>
                        <h3>No Gate Events</h3>
                        <p>Gate events will appear here when payments are processed</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab: History -->
        <div class="tab-content" id="tab-history">
            <div class="panel">
                <div class="panel-title">📜 Parking History</div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Car Number</th>
                                <th>Slot</th>
                                <th>Entry</th>
                                <th>Exit</th>
                                <th>Duration</th>
                                <th>Fee</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <!-- Filled by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ====== State ======
        let currentTheme = 'light';

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme === 'light' ? 'light' : '');
            if (currentTheme === 'dark') document.documentElement.removeAttribute('data-theme');
            document.querySelector('.theme-toggle').textContent = currentTheme === 'light' ? '🌙' : '☀️';
        }

        // ====== Tabs ======
        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            event.target.classList.add('active');
        }

        // ====== Data Loading ======
        async function loadDashboard() {
            try {
                const [slots, logs, gateEvents] = await Promise.all([
                    fetch('/api/slots').then(r => r.json()),
                    fetch('/api/logs').then(r => r.json()),
                    fetch('/api/gate-events').then(r => r.json())
                ]);

                renderStats(slots, logs);
                renderSlotGrids(slots);
                renderGateEvents(gateEvents);
                renderHistory(logs);
            } catch (err) {
                console.error('Failed to load dashboard:', err);
            }
        }

        // ====== Render Stats ======
        function renderStats(slots, logs) {
            const available = slots.filter(s => s.status === 'available').length;
            const occupied = slots.filter(s => s.status === 'booked').length;
            document.getElementById('statTotal').textContent = slots.length;
            document.getElementById('statAvailable').textContent = available;
            document.getElementById('statOccupied').textContent = occupied;
            document.getElementById('statSessions').textContent = logs.length;
        }

        // ====== Render Slot Cards ======
        function renderSlotGrids(slots) {
            const renderCard = (slot) => `
                <div class="admin-slot-card ${slot.status}">
                    <div class="admin-slot-header">
                        <div class="admin-slot-id">
                            <span class="icon">${slot.status === 'booked' ? '🚗' : '🅿️'}</span>
                            ${slot.id}
                        </div>
                        <div class="status-pill ${slot.status}">
                            <span>●</span>
                            ${slot.status === 'available' ? 'Available' : 'Occupied'}
                        </div>
                    </div>
                    ${slot.entry ? `
                        <div class="admin-slot-detail">🔖 ${slot.entry['Number Plate']}</div>
                        <div class="admin-slot-detail">🕐 ${slot.entry['Entry Time']}</div>
                    ` : `
                        <div class="admin-slot-detail" style="opacity:0.5;">No vehicle parked</div>
                    `}
                </div>
            `;

            const html = slots.map(renderCard).join('');
            document.getElementById('adminSlotGrid').innerHTML = html;
            document.getElementById('allSlotsGrid').innerHTML = html;
        }

        // ====== Gate Events ======
        function renderGateEvents(events) {
            if (!events || events.length === 0) return;

            const html = events.map(e => `
                <div class="gate-event-card">
                    <div class="gate-badge ${e.gate_status || e.gateStatus}">
                        <span class="dot"></span>
                        ${(e.gate_status || e.gateStatus || '').toUpperCase()}
                    </div>
                    <div style="flex:1;">
                        <div style="font-weight:600; font-size:0.9rem;">${e.car_number || e.carNumber}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">
                            Slot ${e.slot_id || e.slotId} · ₹${e.fee}
                        </div>
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-dim);">
                        ${new Date(e.timestamp).toLocaleString()}
                    </div>
                </div>
            `).join('');

            document.getElementById('gateEventsContainer').innerHTML = html;
        }

        // ====== History Table ======
        function renderHistory(logs) {
            const html = logs.map(log => `
                <tr>
                    <td><strong>${log['Number Plate']}</strong></td>
                    <td>${log.Slot}</td>
                    <td>${log['Entry Time']}</td>
                    <td>${log['Exit Time'] || '<em style="color:var(--text-dim)">Active</em>'}</td>
                    <td>${log['Duration (mins)'] ? Math.round(log['Duration (mins)']) + ' min' : '—'}</td>
                    <td>${log['Fee (INR)'] ? '₹' + log['Fee (INR)'] : '—'}</td>
                </tr>
            `).join('');
            document.getElementById('historyTable').innerHTML = html;
        }

        function logout() {
            window.location.href = 'login.html';
        }

        // Initial load + auto-refresh
        loadDashboard();
        setInterval(loadDashboard, 5000);
    </script>
</body>

</html>
